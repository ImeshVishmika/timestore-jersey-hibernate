name: Build and Deploy TimeStore

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: mvn clean package

      - name: Verify JAR
        run: |
          ls -lah target
          test -s target/TimeStore-1.0-jar-with-dependencies.jar

      - name: Copy JAR to Azure VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "target/TimeStore-1.0-jar-with-dependencies.jar"
          target: "/tmp/timestore-upload/"
          strip_components: 1

      - name: Copy webapp to Azure VM
        uses: appleboy/scp-action@v1
        with :
         host : ${{secrets.VM_HOST}}
         username : ${{secrets.VM_USERNAME}}
         key : ${{secrets.VM_SSH_KEY}}
         source : "webapp"
         target : "/tmp/timestore-upload"

      - name: Install and restart TimeStore
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            test -s /tmp/timestore-upload/TimeStore-1.0-jar-with-dependencies.jar
            test -d /tmp/timestore-upload/webapp
            test -d /tmp/timestore-upload/webapp/views/User
            test -d /tmp/timestore-upload/webapp/views/Admin

            sudo mkdir -p /opt/timestore

            sudo install \
              -o root \
              -g root \
              -m 0644 \
              /tmp/timestore-upload/TimeStore-1.0-jar-with-dependencies.jar \
              /opt/timestore/TimeStore-1.0-jar-with-dependencies.jar

            sudo rm -rf /opt/timestore/webapp

            sudo cp -a \
              /tmp/timestore-upload/webapp \
              /opt/timestore/webapp

            sudo chown -R root:root /opt/timestore/webapp

            sudo systemctl restart timestore

            sleep 3

            sudo systemctl is-active --quiet timestore

            sudo systemctl status timestore --no-pager